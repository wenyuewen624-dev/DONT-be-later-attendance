<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>个人考勤日历</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1f2329;--muted:#8f959e;--line:#e5e6e8;--red:#f04438;--green:#16a34a;--orange:#f79009;--blue:#3370ff;--shadow:0 8px 28px rgba(31,35,41,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif}
button,input{font:inherit}.app{max-width:1280px;margin:0 auto;padding:28px 30px 50px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand h1{margin:0;font-size:25px}.brand p{margin:6px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;cursor:pointer}.btn:hover{background:#f8f9fa}.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.stat{background:var(--card);border-radius:13px;padding:16px 17px;box-shadow:var(--shadow)}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:22px;font-weight:700;margin-top:7px}.stat.red .value{color:var(--red)}.stat.green .value{color:var(--green)}.stat.orange .value{color:var(--orange)}
.layout{display:grid;grid-template-columns:1fr 340px;gap:18px}.card{background:var(--card);border-radius:15px;box-shadow:var(--shadow)}
.calendar{padding:20px}.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.month{font-size:20px;font-weight:700}.nav{display:flex;gap:7px}.nav button{width:34px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}.week,.days{display:grid;grid-template-columns:repeat(7,1fr)}.week div{color:var(--muted);font-size:12px;text-align:center;padding:8px 0}.day{min-height:105px;border:1px solid var(--line);margin:-1px 0 0 -1px;padding:9px;cursor:pointer;position:relative;background:#fff}.day:hover{background:#fafbfc}.day.other{color:#c9cdd3;background:#fafafa}.day.today{outline:2px solid var(--blue);outline-offset:-2px;z-index:1}.num{font-size:13px;font-weight:600}.tag{font-size:11px;margin-top:10px;line-height:1.5}.tag.red{color:var(--red)}.tag.green{color:var(--green)}.tag.orange{color:var(--orange)}.tag.gray{color:var(--muted)}.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px}
.side{padding:20px}.side h2{font-size:18px;margin:0 0 5px}.date{font-size:13px;color:var(--muted);margin-bottom:18px}.clock{font-size:30px;font-weight:700;margin:4px 0 15px}.shift{background:#f7f8fa;border-radius:10px;padding:12px;font-size:13px;margin-bottom:14px}.shift b{float:right}.check{width:100%;border:0;border-radius:10px;padding:13px;margin:6px 0;cursor:pointer;font-weight:700}.in{background:#eaf7ee;color:#16803c}.out{background:#fff2e8;color:#c75b0b}.disabled{opacity:.45;cursor:not-allowed}.result{margin-top:15px;border-top:1px solid var(--line);padding-top:14px}.row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px}.row span:first-child{color:var(--muted)}.section{margin-top:18px}.section h3{font-size:14px;margin:0 0 9px}.manual{margin-top:15px;border-top:1px solid var(--line);padding-top:14px}.manual h3,.noteBox h3{font-size:14px;margin:0 0 9px}.manualGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.manualGrid label{font-size:11px;color:var(--muted)}.manualGrid input{width:100%;margin-top:4px;padding:8px;border:1px solid var(--line);border-radius:8px}.saveManual,.saveNote{margin-top:8px;width:100%;border:0;border-radius:8px;background:#f0f4ff;color:var(--blue);padding:9px;cursor:pointer}.noteBox{margin-top:15px;border-top:1px solid var(--line);padding-top:14px}.noteBox textarea{width:100%;min-height:78px;resize:vertical;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:13px;line-height:1.5}.notePreview{font-size:10px;color:#667085;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.makeupBox{margin-top:15px;border-top:1px solid var(--line);padding-top:14px}.makeupBox h3{font-size:14px;margin:0 0 9px}.makeupBox p{font-size:11px;color:var(--muted);margin:0 0 8px;line-height:1.5}.makeupGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.makeupGrid label{font-size:11px;color:var(--muted)}.makeupGrid input{width:100%;margin-top:4px;padding:8px;border:1px solid var(--line);border-radius:8px}.saveMakeup{margin-top:8px;width:100%;border:0;border-radius:8px;background:#f0f4ff;color:var(--blue);padding:9px;cursor:pointer}.legend{display:flex;flex-wrap:wrap;gap:9px;font-size:12px;color:var(--muted)}.legend i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{width:min(470px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.18)}.modalbox h2{margin:0 0 18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px}.form .full{grid-column:1/-1}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.app{padding:15px}.stats{grid-template-columns:1fr 1fr}.day{min-height:82px;padding:6px}.tag{font-size:10px}.top{align-items:flex-start;gap:10px}.actions{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><h1>个人考勤日历</h1><p id="summaryLine">09:30–18:00 · 周一至周五 · 月薪 ¥6,500</p></div>
    <div class="actions"><button class="btn" onclick="openSettings()">⚙ 设置</button><button class="btn" onclick="clearAll()">清空数据</button></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="label">本月出勤</div><div class="value" id="sAttendance">0 天</div></div>
    <div class="stat red"><div class="label">迟到次数</div><div class="value" id="sLate">0 次</div></div>
    <div class="stat red"><div class="label">迟到罚款</div><div class="value" id="sFine">¥0.00</div></div>
    <div class="stat orange"><div class="label">加班</div><div class="value" id="sOT">0h 0m</div></div>
    <div class="stat orange" title="加班不足1小时不计加班费；满1小时后按实际加班小时计算"><div class="label">加班费</div><div class="value" id="sOTPay">¥0.00</div></div>
    <div class="stat green"><div class="label">预计工资</div><div class="value" id="sPay">¥6,600</div></div>
  </div>
  <div class="layout">
    <div class="card calendar">
      <div class="calhead"><div class="month" id="monthTitle"></div><div class="nav"><button onclick="changeMonth(-1)">‹</button><button onclick="goToday()">今天</button><button onclick="changeMonth(1)">›</button></div></div>
      <div class="week"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
      <div class="days" id="days"></div>
      <div class="section"><div class="legend">
        <span><i style="background:#16a34a"></i>正常</span><span><i style="background:#f04438"></i>迟到</span><span><i style="background:#f79009"></i>加班</span><span><i style="background:#3370ff"></i>今天</span>
      </div></div>
    </div>
    <div class="card side">
      <h2>今日打卡</h2><div class="date" id="selectedDate"></div><div class="clock" id="clock">--:--:--</div>
      <div class="shift">规定工作时间 <b id="shiftText">09:30–18:00</b></div>
      <button class="check in" id="inBtn" onclick="checkIn()">🟢 上班打卡</button>
      <button class="check out" id="outBtn" onclick="checkOut()">🟠 下班打卡</button>
      <div class="manual">
        <h3>⌨️ 手动输入时间</h3>
        <div class="manualGrid">
          <label>实际上班<input id="manualIn" type="time"></label>
          <label>实际下班<input id="manualOut" type="time"></label>
        </div>
        <button class="saveManual" onclick="saveManual()">保存时间</button>
      </div>
      <div class="makeupBox">
        <h3>🔄 调休 / 加班补时</h3>
        <p>如果当天迟到较久，但通过晚上加班把时间补回来，可填写补回的分钟数。补回后只计算剩余迟到。</p>
        <div class="makeupGrid">
          <label>补回迟到（分钟）<input id="makeupMin" type="number" min="0" step="1" placeholder="例如 60"></label>
          <label>调休备注<input id="makeupNote" type="text" placeholder="例如：调休补时"></label>
        </div>
        <button class="saveMakeup" onclick="saveMakeup()">保存调休</button>
      </div>
      <div class="result" id="result"></div>
      <div class="noteBox">
        <h3>📝 今日备注</h3>
        <textarea id="noteInput" placeholder="例如：地铁晚点、加班、请假、外出办公……"></textarea>
        <button class="saveNote" onclick="saveNote()">保存备注</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="settingsModal"><div class="modalbox">
<h2>考勤设置</h2>
<div class="form">
 <div class="field"><label>月薪（元）</label><input id="salary" type="number" value="6500"></div>
 <div class="field"><label>全勤奖金（元）</label><input id="attendanceBonus" type="number" value="100"></div>
 <div class="field"><label>加班费计算基数（元）</label><input id="otBase" type="number" value="6800"></div>
 <div class="field"><label>上班时间</label><input id="startTime" type="time" value="09:30"></div>
 <div class="field"><label>下班时间</label><input id="endTime" type="time" value="18:00"></div>
 <div class="field"><label>每月前几次迟到 ≤30 分钟免罚</label><input id="freeCount" type="number" value="3" min="0"></div>
 <div class="field"><label>打卡机时间修正（分钟）</label><input id="clockOffset" type="number" value="3" step="1"></div>
</div>
<div class="modalfoot"><button class="btn" onclick="closeSettings()">取消</button><button class="btn primary" onclick="saveSettings()">保存</button></div>
</div></div>

<script>
const KEY="personalAttendanceV1";
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{settings:{salary:6500,bonus:100,start:"09:30",end:"18:00",freeCount:3,clockOffset:3},days:{}};
if(data.settings.clockOffset===undefined)data.settings.clockOffset=3;
if(data.settings.otBase===undefined)data.settings.otBase=6800;
let view=new Date(); view.setDate(1); let selectedKey=todayKey();

function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function pad(n){return String(n).padStart(2,"0")}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayKey(){return key(new Date())}
function fmtMin(m){let h=Math.floor(m/60),x=m%60;return h?`${h}h ${x}m`:`${x}m`}
function minutes(t){let [h,m]=t.split(":").map(Number);return h*60+m}
function timeNow(){let d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}
function workday(d){return d.getDay()!==0&&d.getDay()!==6}
function getMonthKeys(y,m){let a=[];let d=new Date(y,m,1),last=new Date(y,m+1,0).getDate();for(let i=1;i<=last;i++){let x=new Date(y,m,i);if(workday(x))a.push(key(x))}return a}
function effectiveLate(x){let raw=x&&x.in?Math.max(0,minutes(x.in)-minutes(data.settings.start)):0;let makeup=x&&x.makeup?Math.max(0,+x.makeup):0;return Math.max(0,raw-makeup)}
function lateFine(late, count){
  const free=data.settings.freeCount;
  if(late<=0) return 0;
  if(count<=free && late<=30) return 0;
  if(late<=30) return late*2;
  if(late<=60) return late*3;
  const days=getMonthKeys(view.getFullYear(),view.getMonth()).length;
  const daily=data.settings.salary/days;
  if(late<=120) return daily*0.75;
  if(late<=180) return daily*1.5;
  return daily*1.5; // 超过3小时按最高一档处理，避免无规则时误算
}
function overtimePay(otMinutes, workdays){
  if(otMinutes < 60 || !workdays) return 0;
  const hourlyRate=(+data.settings.otBase||6800)/workdays/7.5;
  return hourlyRate*(otMinutes/60);
}
function monthly(){
  const keys=getMonthKeys(view.getFullYear(),view.getMonth());
  let attendance=0,lateCount=0,fine=0,ot=0,hasLate=false;
  keys.forEach(k=>{
    let x=data.days[k];
    if(x&&x.in) attendance++;
    if(x&&x.in){
      let l=effectiveLate(x);
      if(l){lateCount++;hasLate=true;fine+=lateFine(l,lateCount)}
    }
    if(x&&x.out) ot+=Math.max(0,minutes(x.out)-minutes(data.settings.end));
  });
  const bonus=hasLate?0:data.settings.bonus;
  const otPay=overtimePay(ot,keys.length);
  const pay=data.settings.salary+bonus-fine+otPay;
  return {attendance,lateCount,fine,ot,otPay,bonus,pay,hasLate,workdays:keys.length};
}
function render(){
  document.getElementById("monthTitle").textContent=`${view.getFullYear()}年${view.getMonth()+1}月`;document.getElementById("summaryLine").textContent=`${data.settings.start}–${data.settings.end} · 周一至周五 · 月薪 ¥${Number(data.settings.salary).toLocaleString()}`;
  const first=new Date(view.getFullYear(),view.getMonth(),1);let start=(first.getDay()+6)%7;
  const last=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();const cells=Math.ceil((start+last)/7)*7;
  let html="";
  for(let i=0;i<cells;i++){let n=i-start+1,d=new Date(view.getFullYear(),view.getMonth(),n),inMonth=n>=1&&n<=last,k=key(d),x=data.days[k]||{};let cls="day"+(!inMonth?" other":"")+(k===todayKey()?" today":"");
    let tags="";
    if(inMonth&&workday(d)&&x.in){let l=effectiveLate(x);let rawLate=Math.max(0,minutes(x.in)-minutes(data.settings.start));let o=x.out?Math.max(0,minutes(x.out)-minutes(data.settings.end)):0;
      if(l) tags+=`<div class="tag red">🔴 迟到 ${l}m</div>`; else tags+=`<div class="tag green">🟢 正常</div>`;
      if(rawLate>0 && x.makeup) tags+=`<div class="tag" style="color:var(--blue)">🔄 补时 ${Math.min(rawLate,+x.makeup)}m</div>`;
      if(o) tags+=`<div class="tag orange">🟠 加班 ${fmtMin(o)}</div>`;
    } else if(inMonth&&workday(d)&&!x.in&&k!==todayKey()) tags+=`<div class="tag gray">未打卡</div>`;
    if(inMonth && x.note) tags+=`<div class="notePreview">📝 ${String(x.note).slice(0,18)}</div>`;
    html+=`<div class="${cls}" onclick="selectDay('${k}')"><div class="num">${inMonth?d.getDate():""}</div>${tags}</div>`;
  }
  document.getElementById("days").innerHTML=html;
  const s=monthly();document.getElementById("sAttendance").textContent=s.attendance+" 天";document.getElementById("sLate").textContent=s.lateCount+" 次";document.getElementById("sFine").textContent="¥"+s.fine.toFixed(2);document.getElementById("sOT").textContent=fmtMin(s.ot);document.getElementById("sOTPay").textContent="¥"+s.otPay.toFixed(2);document.getElementById("sPay").textContent="¥"+s.pay.toFixed(2);
  renderSide();
}
function selectDay(k){selectedKey=k;let d=new Date(k+"T00:00:00");view=new Date(d.getFullYear(),d.getMonth(),1);render()}
function saveNote(){
  const x=data.days[selectedKey]||{};
  const v=document.getElementById("noteInput").value.trim();
  if(v)x.note=v; else delete x.note;
  data.days[selectedKey]=x; save(); render();
}
function saveManual(){
  const d=new Date(selectedKey+"T00:00:00");
  if(!workday(d)){alert("周末无需考勤");return}
  const x=data.days[selectedKey]||{};
  const i=document.getElementById("manualIn").value;
  const o=document.getElementById("manualOut").value;
  if(!i && !o){alert("请至少输入一个时间");return}
  if(i)x.in=i; else delete x.in;
  if(o)x.out=o; else delete x.out;
  data.days[selectedKey]=x; save(); render();
}
function saveMakeup(){
  const x=data.days[selectedKey]||{};
  const v=Math.max(0,Math.floor(+document.getElementById("makeupMin").value||0));
  const raw=x.in?Math.max(0,minutes(x.in)-minutes(data.settings.start)):0;
  if(v>raw){alert("补回时间不能超过当天实际迟到时间（"+raw+"分钟）");return}
  if(v)x.makeup=v;else delete x.makeup;
  const note=document.getElementById("makeupNote").value.trim();
  if(note)x.makeupNote=note;else delete x.makeupNote;
  data.days[selectedKey]=x;save();render();
}
function renderSide(){
  let d=new Date(selectedKey+"T00:00:00"), x=data.days[selectedKey]||{};
  document.getElementById("selectedDate").textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · ${["日","一","二","三","四","五","六"][d.getDay()]}`;
  document.getElementById("noteInput").value=x.note||"";document.getElementById("shiftText").textContent=data.settings.start+"–"+data.settings.end;
  document.getElementById("manualIn").value=x.in||"";
  document.getElementById("manualOut").value=x.out||"";
  document.getElementById("makeupMin").value=x.makeup||"";
  document.getElementById("makeupNote").value=x.makeupNote||"";
  document.getElementById("inBtn").disabled=!!x.in||!workday(d);document.getElementById("outBtn").disabled=!x.in||!!x.out||!workday(d);
  document.getElementById("inBtn").classList.toggle("disabled",document.getElementById("inBtn").disabled);document.getElementById("outBtn").classList.toggle("disabled",document.getElementById("outBtn").disabled);
  if(!x.in&&!x.out){document.getElementById("result").innerHTML="<div class='row'><span>状态</span><b>尚未打卡</b></div>";return}
  let rawLate=x.in?Math.max(0,minutes(x.in)-minutes(data.settings.start)):0,l=effectiveLate(x),o=x.out?Math.max(0,minutes(x.out)-minutes(data.settings.end)):0;
  let monthKeys=getMonthKeys(d.getFullYear(),d.getMonth()),count=0;monthKeys.forEach(k=>{let z=data.days[k];if(z&&z.in&&k<=selectedKey&&effectiveLate(z)>0)count++});
  let f=l?lateFine(l,count):0;
  document.getElementById("result").innerHTML=`<div class="row"><span>上班打卡</span><b>${x.in||"—"}</b></div><div class="row"><span>原始迟到</span><b>${rawLate?rawLate+"分钟":"无"}</b></div><div class="row"><span>调休/补时</span><b style="color:var(--blue)">${x.makeup?x.makeup+"分钟":"无"}</b></div><div class="row"><span>有效迟到</span><b style="color:${l?"var(--red)":"var(--green)"}">${l?l+"分钟":"无"}</b></div><div class="row"><span>本月计入迟到次数</span><b>${count} 次</b></div><div class="row"><span>本次罚款</span><b>¥${f.toFixed(2)}</b></div><div class="row"><span>下班打卡</span><b>${x.out||"—"}</b></div><div class="row"><span>加班</span><b style="color:var(--orange)">${o?fmtMin(o):"无"}</b></div>`;
}
function checkIn(){
  let d=new Date(selectedKey+"T00:00:00");if(!workday(d))return;
  let x=data.days[selectedKey]||{};if(x.in)return;
  let now=new Date();now.setMinutes(now.getMinutes()+(+data.settings.clockOffset||0));
  x.in=pad(now.getHours())+":"+pad(now.getMinutes());
  data.days[selectedKey]=x;save();render()
}
function checkOut(){let d=new Date(selectedKey+"T00:00:00");if(!workday(d))return;let x=data.days[selectedKey]||{};if(!x.in||x.out)return;x.out=timeNow();data.days[selectedKey]=x;save();render()}
function changeMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);selectedKey=key(new Date(view.getFullYear(),view.getMonth(),1));render()}
function goToday(){let d=new Date();view=new Date(d.getFullYear(),d.getMonth(),1);selectedKey=key(d);render()}
function openSettings(){let s=data.settings;salary.value=s.salary;attendanceBonus.value=s.bonus;otBase.value=s.otBase??6800;startTime.value=s.start;endTime.value=s.end;freeCount.value=s.freeCount;clockOffset.value=s.clockOffset??3;settingsModal.classList.add("show")}
function closeSettings(){settingsModal.classList.remove("show")}
function saveSettings(){data.settings={salary:+salary.value||6500,bonus:+attendanceBonus.value||100,otBase:+otBase.value||6800,start:startTime.value||"09:30",end:endTime.value||"18:00",freeCount:Math.max(0,+freeCount.value||3),clockOffset:+clockOffset.value||0};save();closeSettings();render()}
function clearAll(){if(confirm("确定清空所有打卡记录吗？设置不会被删除。")){data.days={};save();render()}}
setInterval(()=>{document.getElementById("clock").textContent=new Date().toLocaleTimeString("zh-CN",{hour12:false});},1000);render();
</script>
</body>
</html>
